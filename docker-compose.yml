version: '3.9'
services:
  postgres:
    image: supabase/postgres:15.1.0.147
    container_name: geo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - geo_pgdata:/var/lib/postgresql/data

volumes:
  geo_pgdata:
