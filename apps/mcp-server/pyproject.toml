[project]
name = "geo-command-center-mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=0.2.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
geo-mcp-server = "geo_mcp_server.server:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
