[project]
name = "geo-command-center-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "rich>=13.7.0",
]

[project.scripts]
geo = "geo_cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
